name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download my code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push the Image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: yourdockerusername/my-script:latestname: Build Docker Image

# 1. When should this run?
on:
  push:
    branches:
      - main

# 2. What should it do?
jobs:
  build-and-test:
    # Spin up a temporary Ubuntu server
    runs-on: ubuntu-latest

    # The step-by-step instructions
    steps:
      - name: Download my code from the repository
        uses: actions/checkout@v4

      - name: Build the Docker Image
        run: docker build -t my-script .
        
      - name: Prove it works by running the container
        run: docker run my-script
